{% extends 'adminapp/adminmaster.html' %}
{% load static %}
{% block content %}


<section class="section">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Category Table</h5>
                    <a href="{% url 'addcategory' %}"><button class="btn btn-primary">Add Category</button></a>
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Category Name</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for ab in category %}
                            <tr>
                                <td>{{forloop.counter}}</td>
                                <td>{{ab.name}}</td>
                                {% comment %} <td>{{ab.action}}</td> {% endcomment %}
                                <td>
                                    <a href="{% url 'updatecategory' ab.id %}"><button class="btn btn-primary btn-sm">Update</button></a>
                                    <a href="{% url 'deletecategory' ab.id %}"><button class="btn btn-danger btn-sm" onclick="confirmDelete()">Delete</button></a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    function confirmDelete() {
        return confirm('Are you sure you want to delete this category?');
    }
</script>

{% endblock %}
