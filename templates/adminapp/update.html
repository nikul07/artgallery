{% extends 'adminapp/adminmaster.html' %}
{% block content %}
{% load static %}

<div class="pagetitle">
    <h1>Product Form Elements</h1> 
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'indexview' %}">Home</a></li>
            <li class="breadcrumb-item">Forms</li>
            <li class="breadcrumb-item active">Elements</li>
        </ol>
    </nav>
</div><!-- End Page Title -->

<section class="section">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">General Form Elements</h5>

                    <!-- General Form Elements -->
                    <form method="post" action="" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row mb-3">
                            <label for="inputText" class="col-sm-2 col-form-label">Category</label>
                            <div class="col-sm-10">
                                {% comment %} <input type="text" value="{{ data.category }}" name="category" class="form-control"> {% endcomment %}
                                <select class="form-control" name="category">
                                    {% for ab in category %}
                                    <option {% if data.category == ab %} selected {% endif %} value="{{ab.id}}">{{ab.name}}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="inputText" class="col-sm-2 col-form-label">Art Image</label>
                            <div class="col-sm-10">
                                <!-- Show existing image -->
                                {% if data.Artimage %}
                                    <img src="{{ data.Artimage.url }}" alt="Current Image" width="100">
                                {% endif %}
                                <input type="file" name="Artimage" class="form-control">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="inputText" class="col-sm-2 col-form-label">Art Name</label>
                            <div class="col-sm-10">
                                <input type="text" value="{{ data.name }}" name="name" class="form-control">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="inputText" class="col-sm-2 col-form-label">Description</label>
                            <div class="col-sm-10">
                                <input type="text" value="{{ data.description }}" name="description" class="form-control">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="inputNumber" class="col-sm-2 col-form-label">Product Price</label>
                            <div class="col-sm-10">
                                <input type="number" value="{{ data.price }}" name="price" class="form-control">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="inputNumber" class="col-sm-2 col-form-label">Quantity</label>
                            <div class="col-sm-10">
                                <input type="number" value="{{ data.Quantity }}" name="Quantity" class="form-control">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="inputNumber" class="col-sm-2 col-form-label">Total</label>
                            <div class="col-sm-10">
                                <input type="number" value="{{ data.Total }}" name="Total" class="form-control">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="col-sm-2 col-form-label">Submit Button</label>
                            <div class="col-sm-10">
                                <button type="submit" class="btn btn-primary">Submit Form</button>
                            </div>
                        </div>

                    </form><!-- End General Form Elements -->
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
