{% extends 'adminapp/adminmaster.html' %}
{% load static %}
{% block content %}
<div class="container mt-4">
  <div class="pagetitle">
    <h1>Edit User</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'indexview' %}">Home</a></li>
        <li class="breadcrumb-item"><a href="{% url 'usermanageview' %}">Manage Users</a></li>
        <li class="breadcrumb-item active">Edit User</li>
      </ol>
    </nav>
  </div>

  <section class="section">
    <div class="row">
      <div class="col-lg-8 offset-lg-2">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Edit User Details</h5>

            <!-- Form Starts -->
            <form method="post">
              {% csrf_token %}

              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
              </div>

              <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" name="role" required>
                  <option value="Admin" {% if user.role == "Admin" %}selected{% endif %}>Admin</option>
                  <option value="User" {% if user.role == "User" %}selected{% endif %}>User</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" name="status" required>
                  <option value="Active" {% if user.status == "Active" %}selected{% endif %}>Active</option>
                  <option value="Inactive" {% if user.status == "Inactive" %}selected{% endif %}>Inactive</option>
                </select>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary">Update</button>
                <a href="{% url 'usermanageview' %}" class="btn btn-secondary">Cancel</a>
              </div>

            </form>
            <!-- Form Ends -->

          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
