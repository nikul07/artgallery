{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="{% static 'css/edit_profile.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* General Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .profile-container {
            text-align: center;
        }

        /* Edit Profile Card */
        .edit-profile-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 90%;
            animation: fadeIn 0.6s ease-in-out;
        }

        .edit-profile-card h2 {
            color: #333;
            margin-bottom: 20px;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #ff5e62;
            outline: none;
            box-shadow: 0px 0px 5px rgba(255, 94, 98, 0.5);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
            margin: 5px;
            border: none;
            cursor: pointer;
        }

        .save-btn {
            background-color: #ff5e62;
            color: white;
        }

        .cancel-btn {
            background-color: #3498db;
            color: white;
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* Responsive Design */
        @media (max-width: 500px) {
            .edit-profile-card {
                width: 95%;
            }

            .btn {
                padding: 10px 16px;
                font-size: 14px;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="edit-profile-card">
            <h2>Edit Profile</h2>
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" name="username" value="{{ user.username }}" required>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
                    <input type="email" name="email" value="{{ user.email }}" required>
                </div>

                <button type="submit" class="btn save-btn"><i class="fa-solid fa-save"></i> Save Changes</button>
                <a href="{% url 'userprofileview' %}" class="btn cancel-btn"><i class="fa-solid fa-times"></i> Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
