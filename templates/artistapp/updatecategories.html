{% extends 'artistapp/artistmaster.html' %}
{% load static %}
{% block content %}
   

        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Update Category</h5>
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="categoryName" class="form-label">Category Name</label>
                                    <input type="text" class="form-control" id="categoryName" name="name" placeholder="Enter category name" required>
                                </div>
                                <a href=""><button type="submit" class="btn btn-primary">Update</button></a>
                                <a href="{% url 'artmanagecategories' %}" class="btn btn-secondary">Back</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="path/to/bootstrap.js"></script> <!-- Replace with actual Bootstrap path -->
</body>
</html>

{% endblock %}
